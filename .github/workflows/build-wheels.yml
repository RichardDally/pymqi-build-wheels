# Workflow to build pymqi wheels for different platforms and Python versions
name: Build Wheels

on:
  workflow_dispatch:
    inputs:
      pymqi_version:
        description: 'pymqi version to build (e.g., 1.12.10)'
        required: true
        type: string
      mqc_redist_version:
        description: 'IBM MQ Client Redistributable version (e.g., 9.4.4.1)'
        required: false
        default: '9.4.4.1'
        type: string

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download pymqi source
        run: |
          pip download --no-binary pymqi --no-deps pymqi==${{ inputs.pymqi_version }}
        shell: bash

      - name: Extract pymqi source (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -xzf pymqi-${{ inputs.pymqi_version }}.tar.gz
          mv pymqi-${{ inputs.pymqi_version }} pymqi-src

      - name: Extract pymqi source (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          tar -xzf pymqi-${{ inputs.pymqi_version }}.tar.gz
          mv pymqi-${{ inputs.pymqi_version }} pymqi-src

      # Install system dependencies for pymqi on Linux
      - name: Cache IBM MQ client (Linux)
        if: runner.os == 'Linux'
        id: cache-mqc-linux
        uses: actions/cache@v4
        with:
          path: /opt/mqm
          key: ibm-mqc-${{ inputs.mqc_redist_version }}-linux

      - name: Install IBM MQ client (Linux)
        if: runner.os == 'Linux' && steps.cache-mqc-linux.outputs.cache-hit != 'true'
        run: |
          # Download and install IBM MQ client
          curl -LO https://public.dhe.ibm.com/ibmdl/export/pub/software/websphere/messaging/mqdev/redist/${{ inputs.mqc_redist_version }}-IBM-MQC-Redist-LinuxX64.tar.gz
          sudo mkdir -p /opt/mqm
          sudo tar -xzf ${{ inputs.mqc_redist_version }}-IBM-MQC-Redist-LinuxX64.tar.gz -C /opt/mqm

      - name: Set MQ_FILE_PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "MQ_FILE_PATH=/opt/mqm" >> $GITHUB_ENV

      # Install system dependencies for pymqi on Windows
      - name: Cache IBM MQ client (Windows)
        if: runner.os == 'Windows'
        id: cache-mqc-windows
        uses: actions/cache@v4
        with:
          path: C:\mqm
          key: ibm-mqc-${{ inputs.mqc_redist_version }}-windows

      - name: Install IBM MQ client (Windows)
        if: runner.os == 'Windows' && steps.cache-mqc-windows.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          # Download IBM MQ client for Windows
          $url = "https://public.dhe.ibm.com/ibmdl/export/pub/software/websphere/messaging/mqdev/redist/${{ inputs.mqc_redist_version }}-IBM-MQC-Redist-Win64.zip"
          Invoke-WebRequest -Uri $url -OutFile mqclient.zip
          Expand-Archive -Path mqclient.zip -DestinationPath C:\mqm

      - name: Set MQ_FILE_PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: echo "MQ_FILE_PATH=C:\mqm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build wheel
        working-directory: pymqi-src
        run: |
          pip install build wheel
          python -m build --wheel

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pymqi-src/dist/*.whl
          retention-days: 7

  # Job to create a GitHub Release with all wheels
  create_release:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.pymqi_version }}
          name: pymqi v${{ inputs.pymqi_version }} wheels
          body: |
            Compiled wheels for pymqi version ${{ inputs.pymqi_version }}

            Supported platforms:
            - Linux (Ubuntu) x64
            - Windows x64

            Python versions:
            - Python 3.10
            - Python 3.11
            - Python 3.12
            - Python 3.13
            - Python 3.14
          files: dist/*.whl
          draft: false
          prerelease: false